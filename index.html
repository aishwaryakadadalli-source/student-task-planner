<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Student Task Planner</title>

  <!-- Google Fonts for modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Link to external stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Main App Wrapper -->
  <main class="app-card">
    <!-- Header Section -->
    <header class="planner-header">
      <div class="header-badge">Study Smarter 🚀</div>
      <h1>My Student Task Planner</h1>
      <p class="subtitle">Keep track of homework, assignments, and study goals.</p>
    </header>

    <!-- Task Input Form -->
    <form id="task-form" class="task-input-section" onsubmit="return false;">
      <input type="text" id="task-input" placeholder="e.g., Complete Math Chapter 4 exercises..." autocomplete="off"
        aria-label="New task input">
      <button type="submit" id="add-task-btn">
        <span>Add Task</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </form>

    <!-- Status & Progress Bar -->
    <div class="stats-bar" id="stats-bar">
      <span id="task-count">0 tasks</span>
      <span id="completed-count">0 completed</span>
    </div>

    <!-- Task List Container -->
    <ul id="task-list" class="task-list">
      <!-- Tasks will be dynamically injected here by script.js -->
    </ul>

    <!-- Empty State (shown when there are no tasks) -->
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">📝</div>
      <p class="empty-title">No tasks on your planner yet!</p>
      <p class="empty-subtitle">Type a task above and click "Add Task" to get started.</p>
    </div>
  </main>

  <!-- Link to JavaScript logic -->
  <script src="script.js"></script>
</body>

</html>
